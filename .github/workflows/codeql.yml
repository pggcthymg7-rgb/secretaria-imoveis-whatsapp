name: CodeQL

# Scanner de segurança do GitHub (injeção, rota sem proteção, regex perigosa, segredo no código…).
# Grátis e sem limite em repositório público. Resultado: aba Security › Code scanning e check na PR.
# Se o "default setup" do CodeQL estiver ligado em Settings › Code security, desligue-o (os dois juntos dão erro).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1' # segunda, 04:23 (Brasília): pega vulnerabilidade nova em código antigo

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analisar:
    name: analisar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # só para publicar os achados
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
