name: CI

# Roda os testes do projeto (sintaxe + testes) em toda PR e em todo push na main.
# Grátis e sem limite em repositório público. Os testes usam pasta temporária: nunca tocam em dados reais.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # `npm run verify` = checagem de sintaxe (scripts/check.js) + npm test
      - run: npm run verify
