# Baixa o mapa aberto (OpenStreetMap) de Goiânia e salva em src/brain/data/mapa-osm.json.
# Roda no GitHub (que alcança os servidores Overpass). Como a `main` é protegida (só entra por PR com os checks),
# o robô NÃO grava mais direto nela: grava no branch `mapa-osm-auto` e abre/atualiza UMA PR.
# O mapa já passa nos testes (`npm test`) dentro deste próprio job antes de abrir a PR.
name: Atualizar mapa OSM
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 * *' # dia 1 de cada mês, 03:17 (Brasília): o mapa muda pouco
  push:
    branches: [main] # só na main: em branch de PR (ex.: Dependabot) o robô gravava um commit sem checks e dava conflito
    paths:
      - '.github/workflows/mapa-osm.yml'
      - 'scripts/atualizar-mapa.js'
permissions:
  contents: write # só para gravar o branch `mapa-osm-auto` (a `main` continua protegida)
  pull-requests: write # abrir a PR
concurrency:
  group: mapa-osm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mapa:
    # só na `main` (o agendamento já é sempre na main); evita abrir PR com mudanças de outro branch
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: Baixar mapa
        run: node scripts/atualizar-mapa.js
      - name: Conferir (testes)
        run: npm test
      - name: Salvar no branch mapa-osm-auto e abrir a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/brain/data/mapa-osm.json
          if git diff --cached --quiet; then echo "Mapa sem mudanças."; exit 0; fi
          RAMO="mapa-osm-auto"
          git checkout -B "$RAMO"
          git commit -m "chore: mapa OSM atualizado automaticamente"
          git push --force origin "$RAMO"
          LINK="https://github.com/${GITHUB_REPOSITORY}/compare/main...${RAMO}?expand=1"
          if [ "$(gh pr list --head "$RAMO" --state open --json number --jq 'length')" != "0" ]; then
            echo "Já existe uma PR aberta para o mapa: o push acima a atualizou."
            exit 0
          fi
          if gh pr create --base main --head "$RAMO" --title "chore: mapa OSM atualizado" --body "Mapa do OpenStreetMap baixado pelo robô e já conferido com os testes (npm test). Esta PR não roda os checks sozinha (foi aberta pelo robô): quem decide o merge é o dono, com o bypass de administrador." ; then
            echo "PR aberta."
          else
            echo "::warning::Não consegui abrir a PR sozinho (Settings › Actions › General › marque 'Allow GitHub Actions to create and approve pull requests'). O branch ${RAMO} foi atualizado: abra a PR por este link: ${LINK}"
            echo "Abra a PR por este link: ${LINK}" >> "$GITHUB_STEP_SUMMARY"
          fi
