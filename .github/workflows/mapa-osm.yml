# Baixa o mapa aberto (OpenStreetMap) de Goiânia e salva em src/brain/data/mapa-osm.json.
# Roda no GitHub (que alcança os servidores Overpass) e grava o arquivo no próprio branch.
name: Atualizar mapa OSM
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # segunda 03:17 (Brasília)
  push:
    branches: [main] # só na main: em branch de PR (ex.: Dependabot) o robô gravava um commit sem checks e dava conflito
    paths:
      - '.github/workflows/mapa-osm.yml'
      - 'scripts/atualizar-mapa.js'
permissions:
  contents: write
concurrency:
  group: mapa-osm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mapa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: Baixar mapa
        run: node scripts/atualizar-mapa.js
      - name: Conferir (testes)
        run: npm test
      - name: Salvar no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/brain/data/mapa-osm.json
          if git diff --cached --quiet; then echo "Mapa sem mudanças."; exit 0; fi
          git commit -m "chore: mapa OSM atualizado automaticamente"
          git push origin "HEAD:${GITHUB_REF_NAME}"
