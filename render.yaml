services:
  - type: web
    name: secretaria-imoveis-whatsapp
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PAINEL_SENHA
        sync: false
      - key: API_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: MEU_WHATSAPP_ALERTA
        sync: false
    # ATENÇÃO: no plano gratuito o disco é apagado a cada reinício/deploy
    # (perde a sessão do WhatsApp e a memória de contatos).
    # Recomendado: VM gratuita 24h com memória permanente — veja GUIA_VM_GRATUITA.md
